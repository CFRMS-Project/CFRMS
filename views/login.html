<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Đăng nhập - ShopVN</title>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-4xl rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row">
        <div class="md:w-1/2 bg-black relative text-white p-10 flex flex-col justify-end min-h-[400px]">
            <img src="/images/login-watch.jpg" class="absolute inset-0 w-full h-full object-cover opacity-60"
                alt="Luxury Watch">
            <div class="relative z-10">
                <div class="flex items-center space-x-2 mb-8">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg"></div>
                    <span class="font-bold text-xl tracking-wider">SHOPVN</span>
                </div>
                <h1 class="text-4xl font-bold leading-tight mb-4">Định hình phong cách riêng của bạn.</h1>
                <p class="text-gray-300 text-sm">Khám phá những bộ sưu tập phụ kiện và thời trang cao cấp được tuyển
                    chọn kỹ lưỡng dành riêng cho bạn.</p>
            </div>
        </div>

        <div class="md:w-1/2 p-10 flex flex-col justify-center">
            <h2 class="text-2xl font-bold mb-2">Chào mừng trở lại</h2>
            <p class="text-gray-400 text-sm mb-8">Đăng nhập để tiếp tục trải nghiệm mua sắm đẳng cấp.</p>

            <form class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email hoặc Tên đăng nhập</label>
                    <input type="text" placeholder="name@company.com"
                        class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
                <div>
                    <div class="flex justify-between">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                        <a href="#" class="text-sm text-blue-600 hover:underline">Quên mật khẩu?</a>
                    </div>
                    <input type="password" placeholder="••••••••"
                        class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="remember" class="rounded border-gray-300">
                    <label for="remember" class="text-sm text-gray-500">Ghi nhớ đăng nhập</label>
                </div>
                <button
                    class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition">
                    Đăng nhập →
                </button>
            </form>

            <div class="mt-8">
                <div class="relative flex py-3 items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink mx-4 text-gray-400 text-xs uppercase">Hoặc đăng nhập với</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>
                <div class="grid grid-cols-2 gap-4 mt-4">
                    <button
                        class="flex items-center justify-center py-2 border rounded-xl hover:bg-gray-50 transition font-medium">Google</button>
                    <button
                        class="flex items-center justify-center py-2 border rounded-xl hover:bg-gray-50 transition font-medium">Facebook</button>
                </div>
            </div>
            <p class="text-center text-sm text-gray-500 mt-8">Chưa có tài khoản? <a href="#"
                    class="text-blue-600 font-bold">Đăng ký ngay</a></p>
        </div>
    </div>
</body>

</html>
