services:
  # Database 
  db-test:
    image: postgres:16-alpine
    container_name: cfrms_db_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cfrms_test
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web App 
  web-test:
    build:
      context: .
      dockerfile: dockerfile
      target: builder
    container_name: cfrms_web_test
    ports:
      - "3001:3001"
    env_file:
      - .env.test
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db-test:5432/cfrms_test
      - NODE_ENV=test
      - ENABLE_TEST_RESET_API=true
    depends_on:
      db-test:
        condition: service_healthy
    command: >
      sh -c "
        mkdir -p cypress/fixtures &&
        npx prisma db push --schema=prisma/schema.prisma &&
        npx tsx prisma/seed.test.ts &&
        npm run dev:test
      "
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3001/login || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Cypress E2E Test Runner 
  cypress:
    image: "cypress/included:latest"
    container_name: cfrms_cypress
    depends_on:
      web-test:
        condition: service_healthy
    env_file:
      - .env.test
    environment:
      - CYPRESS_baseUrl=http://web-test:3001
      - CYPRESS_DB_URL=postgresql://postgres:postgres@db-test:5432/cfrms_test
    working_dir: /e2e
    volumes:
      - ./:/e2e
