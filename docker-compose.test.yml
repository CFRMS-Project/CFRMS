services:
  db-test:
    image: postgres:16-alpine
    container_name: cfrms_db_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cfrms_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web-test:
    build: .
    container_name: cfrms_web_test
    ports:
      - "3001:3000"
    env_file:
      - .env.test
    depends_on:
      db-test:
        condition: service_healthy

  cypress:
    image: "cypress/included:latest"
    container_name: cfrms_cypress
    depends_on:
      - web-test
    environment:
      - CYPRESS_baseUrl=http://web-test:3000
      # Để Cypress gọi Prisma kết nối được DB Test khi chạy ngầm bằng Docker
      - CYPRESS_DB_URL=postgresql://postgres:postgres@db-test:5432/cfrms_test
    working_dir: /e2e
    volumes:
      - ./:/e2e
