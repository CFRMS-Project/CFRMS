name: Cypress Tests
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
jobs:
  cypress-run:
    runs-on: ubuntu-latest
    
    # 1. BẮT BUỘC: Cần có Database test trên CI
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cfrms_test
        ports:
          - 5433:5432 # Map ra port 5433 để khớp với TEST_DB_URL
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2] # Chạy song song 2 luồng
        
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt Node modules
        run: npm ci

      - name: Tạo file .env.test giả lập
        run: |
          # Sinh token ngẫu nhiên cho API reset (tránh hardcode)
          RESET_TOKEN=$(openssl rand -hex 16)
          echo "TEST_RESET_TOKEN=$RESET_TOKEN" >> $GITHUB_ENV

          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5433/cfrms_test" > .env.test
          echo "PORT=3001" >> .env.test
          echo "NODE_ENV=test" >> .env.test
          echo "ENABLE_TEST_RESET_API=true" >> .env.test
          echo "TEST_RESET_TOKEN=$RESET_TOKEN" >> .env.test
          echo "SESSION_SECRET=${{ secrets.SESSION_SECRET || 'fallback_secret_ci' }}" >> .env.test
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME || 'mock' }}" >> .env.test
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY || 'mock' }}" >> .env.test
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET || 'mock' }}" >> .env.test

      # TÁCH RỜI BƯỚC PREPARE DATABASE CHO RÕ RÀNG VÀ CHẮC CHẮN
      - name: Chuẩn bị Database (Generate, Push Schema)
        run: |
          npx prisma generate
          # Dùng dotenv để load chính xác .env.test, tránh lỗi không tìm thấy bảng
          npx dotenv -e .env.test -- npx prisma db push --force-reset --accept-data-loss
          # Seed dữ liệu mẫu (tuỳ chọn vì Cypress db:reset cũng sẽ gọi ở mỗi file spec)
          npx dotenv -e .env.test -- npx tsx prisma/seed.test.ts

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          # Đã build và push db ở step trên, không cần build lại
          install: false
          # Bật server test (dotenv đọc .env.test có NODE_ENV=test + ENABLE_TEST_RESET_API=true)
          start: npx dotenv -e .env.test -- npx tsx index.ts
          # Chờ server test sẵn sàng trên port 3001
          wait-on: 'http://localhost:3001/login'
          wait-on-timeout: 120
          record: true
          parallel: true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Truyền thêm biến môi trường cho chắc chắn Server không bị thiếu
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/cfrms_test
          NODE_ENV: test
          ENABLE_TEST_RESET_API: "true"
          # Token động được sinh ở bước trên và lưu vào $GITHUB_ENV
          TEST_RESET_TOKEN: ${{ env.TEST_RESET_TOKEN }}
          CYPRESS_TEST_RESET_TOKEN: ${{ env.TEST_RESET_TOKEN }}